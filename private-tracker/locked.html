<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | RagabVerse Daily Tracker</title>
  <link rel="stylesheet" href="/tracker.css">
</head>
<body class="gate">
  <main class="gate-card">
    <span class="brand">RagabVerse</span>
    <h1>Daily Tracker</h1>
    <p>Enter the tracker password, then sign in with your authorized Microsoft work account.</p>
    <form action="/unlock" method="post">
      <label>Tracker password <input type="password" name="password" required autocomplete="current-password" maxlength="256"></label>
      <button type="submit">Continue to Microsoft</button>
    </form>
  </main>
</body>
</html>
